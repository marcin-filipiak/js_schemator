<!doctype html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Schemator — edytor schematów</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14H8"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14 20 9l-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h5"/></symbol>
      <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 12v6M9 15h6"/></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M7 3v6h10V3M7 21v-7h10v7"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
      <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M5 3v8a7 7 0 0 0 14 0V3"/><path d="M5 9h5M14 9h5"/></symbol>
      <symbol id="i-ports" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h8M6 8v8M18 8v8M8 18h8"/></symbol>
      <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/></symbol>
      <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-line" viewBox="0 0 24 24"><path d="M4 20 20 4"/><circle cx="4" cy="20" r="1.5"/><circle cx="20" cy="4" r="1.5"/></symbol>
      <symbol id="i-rect" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/></symbol>
      <symbol id="i-ellipse" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M3 21c3-1 5-3 6-6L19 5l-2-2L7 13c-3 1-5 3-6 6z"/><path d="M14 6l4 4"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8 19h8"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M4 16 12 8a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-5 5H8l-4-4z"/><path d="M10 10l6 6"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></symbol>
      <symbol id="i-port" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand" title="Schemator">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="26" height="26" rx="6"/>
          <circle cx="10" cy="11" r="2.4"/><circle cx="22" cy="11" r="2.4"/>
          <circle cx="10" cy="21" r="2.4"/><circle cx="22" cy="21" r="2.4"/>
          <path d="M12.4 11h7.2M10 13.4v5.2M22 13.4v5.2M12.4 21h7.2"/>
        </svg>
      </span>
      <span class="brand-name">Schemat<b>or</b></span>
    </div>

    <input id="doc-title" class="doc-title" type="text" value="Schemat pneumatyczny" aria-label="Nazwa schematu" spellcheck="false">

    <div class="topbar-actions">
      <div class="btn-group">
        <button id="btn-undo" class="icon-btn" title="Cofnij (Ctrl+Z)" aria-label="Cofnij"><svg class="icon"><use href="#i-undo"/></svg></button>
        <button id="btn-redo" class="icon-btn" title="Ponów (Ctrl+Y)" aria-label="Ponów"><svg class="icon"><use href="#i-redo"/></svg></button>
      </div>
      <div class="btn-group">
        <button id="btn-new" class="icon-btn" title="Nowy schemat" aria-label="Nowy"><svg class="icon"><use href="#i-new"/></svg></button>
        <button id="btn-open" class="icon-btn" title="Otwórz JSON (Ctrl+O)" aria-label="Otwórz"><svg class="icon"><use href="#i-open"/></svg></button>
      </div>
      <button id="btn-save" class="btn btn-primary" title="Zapisz JSON (Ctrl+S)"><svg class="icon"><use href="#i-save"/></svg><span>Zapisz JSON</span></button>
      <button id="btn-export" class="btn" title="Eksportuj SVG"><svg class="icon"><use href="#i-download"/></svg><span>Eksport SVG</span></button>
      <button id="btn-theme" class="icon-btn" title="Zmień motyw" aria-label="Motyw"><svg class="icon"><use href="#i-moon"/></svg></button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel panel-left">
      <div class="panel-head">
        <div>
          <h2>Biblioteka</h2>
          <p class="subtle">Wciągnij element na płótno</p>
        </div>
        <button id="btn-new-component" class="btn btn-small btn-primary" title="Narysuj własny element"><svg class="icon"><use href="#i-plus"/></svg><span>Nowy</span></button>
      </div>
      <div class="search-box">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="library-search" type="search" placeholder="Szukaj elementów…" autocomplete="off">
      </div>
      <div id="library-list" class="library-list" aria-live="polite"></div>
      <div class="panel-foot">
        <button id="btn-load-demo" class="btn btn-ghost btn-block"><svg class="icon"><use href="#i-new"/></svg><span>Wczytaj przykład</span></button>
      </div>
    </aside>

    <section class="canvas-area" id="canvas-area">
      <div id="grid-layer" class="grid-layer"></div>
      <svg id="canvas" class="canvas" xmlns="http://www.w3.org/2000/svg"></svg>

      <div class="canvas-toolbar">
        <div class="tool-group">
          <button id="btn-zoom-out" class="icon-btn" title="Pomniejsz (−)"><svg class="icon"><use href="#i-zoom-out"/></svg></button>
          <button id="btn-zoom-fit" class="zoom-label" title="Dopasuj do zawartości (0)">100%</button>
          <button id="btn-zoom-in" class="icon-btn" title="Powiększ (+)"><svg class="icon"><use href="#i-zoom-in"/></svg></button>
          <button id="btn-fit" class="icon-btn" title="Dopasuj widok"><svg class="icon"><use href="#i-fit"/></svg></button>
        </div>
        <div class="tool-sep"></div>
        <div class="tool-group">
          <button id="btn-grid" class="icon-btn is-active" title="Siatka"><svg class="icon"><use href="#i-grid"/></svg></button>
          <button id="btn-snap" class="icon-btn is-active" title="Przyciąganie do siatki"><svg class="icon"><use href="#i-magnet"/></svg></button>
          <button id="btn-ports" class="icon-btn is-active" title="Pokaż porty"><svg class="icon"><use href="#i-ports"/></svg></button>
        </div>
      </div>

      <div class="statusbar">
        <span id="status-coords" class="status-item">X 0 · Y 0</span>
        <span id="status-hint" class="status-item status-hint">Przeciągnij od portu do portu, aby połączyć</span>
        <span id="status-version" class="status-item status-version" role="button" tabindex="0" title="Wersja plików aplikacji — kliknij, aby odświeżyć z pominięciem cache">wersja —</span>
        <span id="status-save" class="status-item status-save">Zapisano lokalnie</span>
      </div>

      <div id="drop-hint" class="drop-hint"><svg class="icon"><use href="#i-plus"/></svg><span>Upuść element tutaj</span></div>
    </section>

    <aside class="panel panel-right">
      <div id="inspector" class="inspector"></div>
    </aside>
  </main>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <input type="file" id="file-open" accept="application/json,.json" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
